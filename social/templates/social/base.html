<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini Rede Social{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .meta { color: #555; font-size: 14px; }
        a { color: #0b5ed7; text-decoration: none; }
        a:hover { text-decoration: underline; }
        textarea { width: 100%; min-height: 90px; }
    </style>
</head>
<body>
    <h1><a href="/">Mini Rede Social</a></h1>
    {% block content %}{% endblock %}
</body>
</html>
